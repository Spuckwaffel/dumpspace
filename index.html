<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://avatars.githubusercontent.com https://raw.githubusercontent.com; connect-src 'self' https://api.github.com https://raw.githubusercontent.com; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<script src="theme.js"></script>
<title>Dumpspace</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Dumpspace provides game dumps for multiple games and game engines, created by the community for the community">
<meta name="keywords" content="Dumpspace, SDK, game dumps, Unreal Engine, Unity">
<meta name="theme-color" content="#0b0b0c">
<meta property="og:locale" content="en_US">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Dumpspace">
<meta property="og:title" content="Dumpspace Game Dump Viewer">
<meta property="og:description" content="Get the latest dumps of any supported game.">
<meta property="og:url" content="https://dumpspace.spuckwaffel.com/">
<meta name="twitter:card" content="summary">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="data.js" defer></script>
<script src="shared.js" defer></script>
<script src="home.js" defer></script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Dumpspace</a>

    <label class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input id="search" type="search" placeholder="Search games or uploaders" autocomplete="off" spellcheck="false" aria-label="Search games or uploaders">
      <span class="kbd" aria-hidden="true">/</span>
    </label>

    <nav class="topbar-nav">
      <a class="nav-link" href="recent.html">Recent</a>
      <a class="nav-link" href="changelog.html">Changelog</a>
      <a class="nav-link" href="api.html">API</a>
      <a class="nav-link" href="https://discord.gg/DsET2T89FF" target="_blank" rel="noopener">Discord<svg class="external" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"></path></svg></a>
      <a class="nav-link" href="https://github.com/Spuckwaffel/dumpspace" target="_blank" rel="noopener">GitHub<svg class="external" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"></path></svg></a>
      <a class="button button-primary" href="https://github.com/Spuckwaffel/dumpspace/pulls" target="_blank" rel="noopener">Upload dump</a>
    </nav>

    <details class="nav-menu">
      <summary class="icon-button" aria-label="Menu"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></summary>
      <div class="nav-menu-panel">
        <a href="recent.html">Recent</a>
        <a href="changelog.html">Changelog</a>
        <a href="api.html">API</a>
        <a href="legal.html">About &amp; legal</a>
        <a href="https://discord.gg/DsET2T89FF" target="_blank" rel="noopener">Discord ↗</a>
        <a href="https://github.com/Spuckwaffel/dumpspace" target="_blank" rel="noopener">GitHub ↗</a>
        <a href="https://github.com/Spuckwaffel/dumpspace/pulls" target="_blank" rel="noopener">Upload dump ↗</a>
      </div>
    </details>

    <button class="icon-button theme-toggle" type="button" data-theme-toggle aria-label="Switch to light mode" title="Switch to light mode">
      <svg class="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
      <svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
    </button>
  </header>

  <div class="home">
    <aside class="sidebar" aria-label="Filters">
      <div class="section-label">Engines</div>
      <div id="engines"></div>

      <div class="section-label">Top contributors</div>
      <div id="contributors"></div>

      <div class="sidebar-footer" id="stats"></div>
    </aside>

    <main class="library">
      <div class="library-header">
        <h1 id="library-title">All games</h1>
        <span class="faint num" id="library-count"></span>

        <div class="tools">
          <div class="menu" id="sort-menu">
            <button class="select" type="button" id="sort-button" aria-haspopup="listbox" aria-expanded="false" aria-label="Sort games">Recently updated</button>
            <div class="menu-panel" id="sort-options" role="listbox" aria-label="Sort games" hidden>
              <button type="button" role="option" data-sort="updated" aria-selected="true">Recently updated</button>
              <button type="button" role="option" data-sort="added" aria-selected="false">Date added</button>
              <button type="button" role="option" data-sort="name" aria-selected="false">Name</button>
              <button type="button" role="option" data-sort="engine" aria-selected="false">Engine</button>
              <button type="button" role="option" data-sort="uploader" aria-selected="false">Uploader</button>
            </div>
          </div>

          <div class="segmented" role="group" aria-label="Layout">
            <button type="button" data-view="list" aria-label="List">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
            <button type="button" data-view="grid" aria-label="Grid">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3.5" y="3.5" width="6.5" height="6.5" rx="1"></rect><rect x="14" y="3.5" width="6.5" height="6.5" rx="1"></rect><rect x="3.5" y="14" width="6.5" height="6.5" rx="1"></rect><rect x="14" y="14" width="6.5" height="6.5" rx="1"></rect></svg>
            </button>
          </div>
        </div>
      </div>

      <div id="games"><div class="empty">Loading games…</div></div>
    </main>

    <aside class="activity" aria-label="Recent activity">
      <div class="activity-header">Activity</div>
      <div id="activity"></div>
    </aside>
  </div>
</div>
</body>
</html>
